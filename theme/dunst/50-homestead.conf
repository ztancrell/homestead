# Homestead dunst theme: near-black, firebrick red accents (matches Openbox, kitty and tint2).
# A drop-in over dunst's own /etc/dunst/dunstrc (dunst reads /etc/dunst, not /etc/xdg, when
# XDG_CONFIG_DIRS is unset); a ~/.config/dunst/dunstrc replaces both.

[global]
    width = (250, 380)
    height = (0, 300)
    origin = top-right
    offset = (12, 44)
    notification_limit = 5

    progress_bar = true
    progress_bar_height = 8
    progress_bar_frame_width = 1
    progress_bar_corner_radius = 0
    highlight = "#b22222"

    separator_height = 1
    separator_color = "#2a2a2a"
    padding = 10
    horizontal_padding = 12
    text_icon_padding = 10
    frame_width = 1
    frame_color = "#2a2a2a"
    corner_radius = 0
    gap_size = 6

    font = Sans 10
    line_height = 2
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    vertical_alignment = center
    ellipsize = middle
    show_age_threshold = 60
    word_wrap = yes
    stack_duplicates = true
    hide_duplicate_count = false
    show_indicators = yes

    icon_theme = "Homestead, breeze-dark, hicolor"
    enable_recursive_icon_lookup = true
    icon_position = left
    min_icon_size = 32
    max_icon_size = 48

[urgency_low]
    background = "#0d0d0d"
    foreground = "#b0b0b0"
    frame_color = "#2a2a2a"
    timeout = 5

[urgency_normal]
    background = "#0d0d0d"
    foreground = "#e0e0e0"
    frame_color = "#b22222"
    timeout = 8

[urgency_critical]
    background = "#1a0000"
    foreground = "#ffffff"
    frame_color = "#e04040"
    highlight = "#e04040"
    timeout = 0
